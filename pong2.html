<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong – Tilt in Landscape</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    height:100vh;display:flex;align-items:center;justify-content:center;
    background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
  }
  canvas{background:#000;border:4px solid #0f0;max-width:100%;max-height:100%;}
  #msg{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);color:#0f0;padding:20px 40px;
    border:3px solid #0f0;border-radius:12px;font-size:1.8rem;
    text-align:center;pointer-events:all;cursor:pointer;
  }
  #score{
    position:absolute;top:20px;width:100%;text-align:center;
    color:#0f0;font-size:3rem;letter-spacing:1.5rem;margin-left:1.5rem;
    user-select:none;
  }
</style>
</head>
<body>

<div id="score">0 0</div>
<canvas id="c"></canvas>
<div id="msg">TURN PHONE TO BEGIN</div>

<script>
/* ---------- GLOBALS ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg   = document.getElementById('msg');
const score = document.getElementById('score');

const PADDLE_H = 100, PADDLE_W = 12, BALL = 12;
let playerY, aiY, ballX, ballY, ballVX, ballVY;
let pScore = 0, aiScore = 0;
let running = false;
let hasMotion = false;
let tilt = 0;

/* ---------- RESIZE & ORIENTATION ---------- */
function resize() {
  const maxW = innerWidth * .95, maxH = innerHeight * .95;
  const ratio = 4/3;
  let w = maxW, h = maxW / ratio;
  if (h > maxH) { h = maxH; w = maxH * ratio; }
  canvas.width = w; canvas.height = h;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ---------- ORIENTATION MESSAGE ---------- */
function updateMessage() {
  const landscape = innerWidth > innerHeight;
  msg.textContent = landscape ? 'START' : 'TURN PHONE TO BEGIN';
  msg.style.display = landscape ? 'block' : 'block';
}
updateMessage();
addEventListener('resize', updateMessage);
addEventListener('orientationchange', updateMessage);

/* ---------- MOTION PERMISSION ---------- */
function requestMotion() {
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(r => { if (r==='granted') initMotion(); })
      .catch(()=>{ hasMotion=false; });
  } else { initMotion(); }
}
function initMotion() {
  hasMotion = true;
  addEventListener('devicemotion', e=>{
    if (!e.accelerationIncludingGravity) return;
    tilt = e.accelerationIncludingGravity.x || 0;   // left/right tilt
  });
}

/* ---------- START GAME ---------- */
msg.onclick = () => {
  if (innerWidth <= innerHeight) return;               // block start in portrait
  if (!hasMotion) requestMotion();                     // ask iOS
  msg.style.display = 'none';
  resetBall();
  playerY = canvas.height/2 - PADDLE_H/2;
  aiY     = canvas.height/2 - PADDLE_H/2;
  running = true;
  requestAnimationFrame(loop);
};

/* ---------- BALL ---------- */
function resetBall() {
  ballX = canvas.width/2; ballY = canvas.height/2;
  const ang = (Math.random()-0.5)*Math.PI/3;
  const dir = Math.random()<0.5 ? -1 : 1;
  const speed = 5.5;
  ballVX = dir * speed * Math.cos(ang);
  ballVY = speed * Math.sin(ang);
}

/* ---------- UPDATE ---------- */
function update() {
  /* PLAYER – tilt */
  if (hasMotion) {
    const sens = 1.8;
    const target = playerY + tilt*sens*20;
    playerY += (target-playerY)*0.3;
  }
  playerY = Math.max(0, Math.min(canvas.height-PADDLE_H, playerY));

  /* AI – simple tracking */
  const ballCenter = ballY + BALL/2;
  const target = ballCenter - PADDLE_H/2;
  aiY += (target - aiY) * 0.25;
  aiY = Math.max(0, Math.min(canvas.height-PADDLE_H, aiY));

  /* BALL */
  ballX += ballVX; ballY += ballVY;

  // wall bounce
  if (ballY <= 0 || ballY >= canvas.height-BALL) ballVY *= -1;

  // player paddle
  if (ballX-BALL < 30+PADDLE_W && ballVX<0 &&
      ballY > playerY && ballY < playerY+PADDLE_H) {
    ballX = 30+PADDLE_W;
    const rel = (ballY-playerY)/PADDLE_H - 0.5;
    ballVX = Math.abs(ballVX)*1.08;
    ballVY = rel*9;
    clampSpeed();
  }

  // AI paddle
  if (ballX > canvas.width-30-PADDLE_W-BALL && ballVX>0 &&
      ballY > aiY && ballY < aiY+PADDLE_H) {
    ballX = canvas.width-30-PADDLE_W-BALL;
    const rel = (ballY-aiY)/PADDLE_H - 0.5;
    ballVX = -Math.abs(ballVX)*1.08;
    ballVY = rel*9;
    clampSpeed();
  }

  // scoring
  if (ballX < -50) { aiScore++; resetBall(); }
  if (ballX > canvas.width+50) { pScore++; resetBall(); }
  score.textContent = pScore + ' ' + aiScore;
}
function clampSpeed() {
  const s = Math.hypot(ballVX, ballVY);
  if (s>11) { ballVX=ballVX/s*11; ballVY=ballVY/s*11; }
}

/* ---------- DRAW ---------- */
function draw() {
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // center line
  ctx.strokeStyle='#222'; ctx.lineWidth=3;
  ctx.setLineDash([10,10]);
  ctx.beginPath(); ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,canvas.height); ctx.stroke();
  ctx.setLineDash([]);

  // paddles
  ctx.fillStyle='#0f0'; ctx.fillRect(30, playerY, PADDLE_W, PADDLE_H);
  ctx.fillStyle='#f44'; ctx.fillRect(canvas.width-30-PADDLE_W, aiY, PADDLE_W, PADDLE_H);

  // ball
  ctx.fillStyle='#fff'; ctx.fillRect(ballX, ballY, BALL, BALL);
}

/* ---------- LOOP ---------- */
function loop() {
  if (!running) return;
  update(); draw();
  requestAnimationFrame(loop);
}

/* ---------- TOUCH FALLBACK (tiny nudge) ---------- */
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const y = e.touches[0].clientY - canvas.getBoundingClientRect().top;
  if (y < canvas.height/2) playerY -= 30;
  else playerY += 30;
  playerY = Math.max(0, Math.min(canvas.height-PADDLE_H, playerY));
});
</script>
</body>
</html>

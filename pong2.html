<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Pong vs AI – Tilt to Play!</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      touch-action: none;
    }
    canvas {
      background: #000;
      border: 4px solid #0f0;
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      color: #0f0;
      font-size: 1.5rem;
      text-align: center;
      padding-top: 20px;
    }
    #score {
      font-size: 3rem;
      letter-spacing: 1.5rem;
      margin-left: 1.5rem;
      user-select: none;
    }
    #start, #perm {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: #0f0;
      border: 3px solid #0f0;
      padding: 20px 40px;
      font-size: 1.8rem;
      cursor: pointer;
      pointer-events: all;
      text-align: center;
      border-radius: 12px;
    }
    #perm { display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="ui">
    <div id="score">0 0</div>
  </div>
  <canvas id="game"></canvas>
  <button id="start">TILT TO START</button>
  <button id="perm" class="hidden">ALLOW MOTION</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreDiv = document.getElementById('score');
    const startBtn = document.getElementById('start');
    const permBtn = document.getElementById('perm');

    // Responsive canvas
    function resize() {
      const maxW = window.innerWidth * 0.95;
      const maxH = window.innerHeight * 0.95;
      const ratio = 4/3;
      let w = maxW, h = maxW / ratio;
      if (h > maxH) { h = maxH; w = maxH * ratio; }
      canvas.width = w;
      canvas.height = h;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    const paddleHeight = 100, paddleWidth = 12, ballSize = 12;
    let playerY = canvas.height/2 - paddleHeight/2;  // Left (player)
    let aiY = canvas.height/2 - paddleHeight/2;      // Right (AI)
    let ballX = canvas.width/2, ballY = canvas.height/2;
    let ballVX = 0, ballVY = 0;
    let playerScore = 0, aiScore = 0;
    let running = false;
    let hasPermission = false;

    // AI & Physics
    const paddleSpeed = 6;
    const ballSpeed = 5.5;
    const maxBallSpeed = 11;
    const aiReaction = 0.25; // 0 = perfect, 1 = slow

    // Gyro control
    let tilt = 0;
    function handleMotion(e) {
      if (!e.accelerationIncludingGravity) return;
      const x = e.accelerationIncludingGravity.x || 0;
      tilt = x; // Positive = tilt right → paddle down
    }

    // Request permission (iOS 13+)
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      permBtn.onclick = () => {
        DeviceMotionEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              hasPermission = true;
              permBtn.classList.add('hidden');
              window.addEventListener('devicemotion', handleMotion);
            }
          })
          .catch(console.error);
      };
    } else {
      hasPermission = true;
      window.addEventListener('devicemotion', handleMotion);
    }

    // Start game
    startBtn.onclick = () => {
      if (!hasPermission && typeof DeviceMotionEvent.requestPermission === 'function') {
        permBtn.classList.remove('hidden');
        return;
      }
      startBtn.classList.add('hidden');
      resetBall();
      running = true;
      requestAnimationFrame(loop);
    };

    function resetBall() {
      ballX = canvas.width/2;
      ballY = canvas.height/2;
      const angle = (Math.random() - 0.5) * Math.PI / 3;
      const dir = Math.random() < 0.5 ? -1 : 1;
      ballVX = dir * ballSpeed * Math.cos(angle);
      ballVY = ballSpeed * Math.sin(angle);
    }

    function update() {
      // === PLAYER: TILT CONTROL ===
      const sensitivity = 1.8;
      const targetY = playerY + tilt * sensitivity * 20;
      playerY += (targetY - playerY) * 0.3;
      playerY = Math.max(0, Math.min(canvas.height - paddleHeight, playerY));

      // === AI: Track ball with delay ===
      const ballCenter = ballY + ballSize/2;
      const aiTarget = ballCenter - paddleHeight/2;
      const diff = aiTarget - aiY;
      aiY += diff * aiReaction;
      aiY = Math.max(0, Math.min(canvas.height - paddleHeight, aiY));

      // === BALL MOVEMENT ===
      ballX += ballVX;
      ballY += ballVY;

      // Wall bounce
      if (ballY <= 0 || ballY >= canvas.height - ballSize) {
        ballVY *= -1;
        ballY = Math.max(0, Math.min(canvas.height - ballSize, ballY));
      }

      // === PLAYER PADDLE HIT (LEFT) ===
      if (
        ballX - ballSize < 30 + paddleWidth &&
        ballY > playerY && ballY < playerY + paddleHeight &&
        ballVX < 0
      ) {
        ballX = 30 + paddleWidth;
        const rel = (ballY - playerY) / paddleHeight - 0.5;
        ballVX = Math.abs(ballVX) * 1.08;
        ballVY = rel * 9;
        clampSpeed();
      }

      // === AI PADDLE HIT (RIGHT) ===
      if (
        ballX > canvas.width - 30 - paddleWidth - ballSize &&
        ballY > aiY && ballY < aiY + paddleHeight &&
        ballVX > 0
      ) {
        ballX = canvas.width - 30 - paddleWidth - ballSize;
        const rel = (ballY - aiY) / paddleHeight - 0.5;
        ballVX = -Math.abs(ballVX) * 1.08;
        ballVY = rel * 9;
        clampSpeed();
      }

      // === SCORE ===
      if (ballX < -50) { aiScore++; resetBall(); }
      if (ballX > canvas.width + 50) { playerScore++; resetBall(); }

      scoreDiv.textContent = playerScore + ' ' + aiScore;
    }

    function clampSpeed() {
      const speed = Math.hypot(ballVX, ballVY);
      if (speed > maxBallSpeed) {
        ballVX = ballVX / speed * maxBallSpeed;
        ballVY = ballVY / speed * maxBallSpeed;
      }
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dashed center line
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width/2, 0);
      ctx.lineTo(canvas.width/2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#0f0'; // Player = green
      ctx.fillRect(30, playerY, paddleWidth, paddleHeight);
      ctx.fillStyle = '#f44'; // AI = red
      ctx.fillRect(canvas.width - 30 - paddleWidth, aiY, paddleWidth, paddleHeight);

      // Ball
      ctx.fillStyle = '#fff';
      ctx.fillRect(ballX, ballY, ballSize, ballSize);

      // Tilt indicator (optional debug)
      // ctx.fillStyle = '#0f0';
      // ctx.font = '12px monospace';
      // ctx.fillText(`TILT: ${tilt.toFixed(2)}`, 10, canvas.height - 10);
    }

    function loop() {
      if (!running) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Touch fallback (tap to nudge)
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const half = canvas.height / 2;
      if (touch.clientY < half) playerY -= 30;
      else playerY += 30;
      playerY = Math.max(0, Math.min(canvas.height - paddleHeight, playerY));
    });

    // Auto-show permission on iOS
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      startBtn.onclick = () => permBtn.classList.remove('hidden');
    }
  </script>
</body>
</html>

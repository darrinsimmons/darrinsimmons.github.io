<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Darrin's Games</title>
  <style>
    :root {
      --bg: #111;
      --fg: #0f0;
      --card-bg: #000;
      --border: #0f0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 20px 0 10px;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 0 10px var(--fg);
    }
    p.subtitle {
      margin-bottom: 30px;
      opacity: 0.8;
      font-size: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }
    .card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
      border-color: #0f08;
    }
    .card h3 {
      margin-bottom: 12px;
      font-size: 1.4rem;
    }
    .card p {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 15px;
    }
    #qrcode {
      width: 160px;
      height: 160px;
      margin: 0 auto 15px;
      padding: 10px;
      background: white;
      border-radius: 8px;
    }
    .btn {
      background: transparent;
      color: var(--fg);
      border: 2px solid var(--fg);
      padding: 10px 20px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--fg);
      color: var(--bg);
    }
    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.6;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>DARRIN'S GAMES</h1>
  <p class="subtitle">Scan or tap to play</p>

  <div class="grid">

    <!-- QR CODE CARD -->
    <div class="card" onclick="window.open('https://darrinsimmons.github.io/games', '_blank')">
      <h3>QR Code</h3>
      <div id="qrcode"></div>
      <p>Scan to open games hub</p>
      <button class="btn">OPEN IN BROWSER</button>
    </div>

    <!-- PONG 1 -->
    <div class="card" onclick="window.location.href='./pong.html'">
      <h3>Pong Classic</h3>
      <p>Tilt-controlled vs AI</p>
      <button class="btn">PLAY PONG 1</button>
    </div>

    <!-- PONG 2 -->
    <div class="card" onclick="window.location.href='./pong2.html'">
      <h3>Pong Pro</h3>
      <p>Enhanced physics & speed</p>
      <button class="btn">PLAY PONG 2</button>
    </div>

    <!-- PONG 3 -->
    <div class="card" onclick="window.location.href='./pong3.html'">
      <h3>Pong Extreme</h3>
      <p>Fast. Furious. Unforgiving.</p>
      <button class="btn">PLAY PONG 3</button>
    </div>

  </div>

  <footer>
    Hosted on GitHub Pages • No tracking • Made with 
  </footer>

  <!-- QR Code Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode.js@1.0.0/lib/qrcode.min.js"></script>
  <script>
    // Generate QR Code
    new QRCode(document.getElementById("qrcode"), {
      text: "https://darrinsimmons.github.io/games",
      width: 160,
      height: 160,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Santa Tracker</title>
  <style>
    /* Full-screen centered background image */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      color: white;
      margin: 0;
      min-height: 100vh;
      background: url('./background.jpg?dl=1') center center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 320px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.4); /* Optional: dark overlay for readability */
      border-radius: 20px;
      padding: 30px 20px;
      backdrop-filter: blur(8px);
    }

    .icon {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      margin: 0 auto 20px;
      background: white;
      padding: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .icon img {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: contain;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    p {
      font-size: 16px;
      margin-bottom: 30px;
      opacity: 0.95;
    }

    .install-btn {
      display: inline-block;
      background: #fff;
      color: #d32f2f;
      font-size: 18px;
      font-weight: 600;
      padding: 16px 36px;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }
    .install-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .footer {
      margin-top: 50px;
      font-size: 13px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Reindeer Logo -->
    <div class="icon">
      <img src="./1024.png?dl=1" alt="Santa Tracker Icon" />
    </div>

    <h1>Santa Tracker</h1>
    <p>Track Santa live in Folsom!</p>

    <!-- Manifest URL (Dropbox) -->
    <a href="itms-services://?action=download-manifest&url./manifest.plist?dl=1"
       class="install-btn">
       Install App
    </a>

    <div class="footer">
      <p>Only works on <strong>registered devices</strong>.<br>
         App expires in 1 year • iOS 13+</p>
    </div>

  </div>
</body>
</html>
